# ==============================================================================
# MAGICENCY® NGINX SERVER BLOCK CONFIGURATION
# Production security configuration for magicency.ir
# Place in: /etc/nginx/sites-available/magicency.ir
# Enable via: ln -s /etc/nginx/sites-available/magicency.ir /etc/nginx/sites-enabled/
# ==============================================================================

# ------------------------------------------------------------------------------
# 01. GLOBAL HTTP TO HTTPS 301 REDIRECTION
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name magicency.ir www.magicency.ir;

    # Let's Encrypt / ACME challenge validation path (allow HTTP for renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Permanent 301 redirect to HTTPS for all other requests
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 02. PRIMARY HTTPS SERVER BLOCK
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name magicency.ir www.magicency.ir;

    # Replace with your actual SSL certificate and private key paths
    ssl_certificate /etc/letsencrypt/live/magicency.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicency.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root pointing to pre-rendered Vite dist folder
    root /var/www/magicency-site/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # CRITICAL SECURITY HOTFIX: BLOCK ACCESS TO .ENV AND ALL DOTFILES
    # --------------------------------------------------------------------------
    # Block any request starting with . or containing /. (e.g. .env, .git, .env.local)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Explicit block for any .env variant specifically
    location ~* \.env {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block access to backup/config file extensions
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --------------------------------------------------------------------------
    # PRODUCTION SECURITY HEADERS
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: https://www.google-analytics.com https://*.google-analytics.com; media-src 'self' https://player.vimeo.com https://*.vimeocdn.com; frame-src 'self' https://player.vimeo.com https://www.googletagmanager.com; connect-src 'self' https://player.vimeo.com https://*.vimeo.com https://*.vimeocdn.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://analytics.google.com https://stats.g.doubleclick.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;" always;

    # --------------------------------------------------------------------------
    # ROUTING & PRE-RENDERED STATIC HTML SUPPORT (STRICT 404 ON UNMATCHED)
    # --------------------------------------------------------------------------
    error_page 404 /404.html;

    location / {
        # Check for direct file, clean .html file, directory index, or 404
        try_files $uri $uri.html $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
